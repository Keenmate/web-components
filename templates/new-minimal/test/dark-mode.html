<!DOCTYPE html>
<html lang="en" data-kmwc="off">
<head>
    <meta charset="UTF-8">
    <title>{{TAG}} dark-mode fixture</title>
</head>
<body>
    <{{TAG}} id="light-default">light default</{{TAG}}>
    <{{TAG}} id="dark-instance" data-theme="dark">dark instance</{{TAG}}>
    <{{TAG}} id="light-instance" data-theme="light">light instance</{{TAG}}>
    <!-- A theme source that is not an ancestor: only core's data-context-theme reaches it. -->
    <div id="dark-panel" data-theme="dark"></div>
    <{{TAG}} id="dark-source" theme-source="#dark-panel">dark source</{{TAG}}>
    <div style="--base-main-bg: rgb(255, 0, 0)">
        <{{TAG}} id="base-themed">--base-main-bg</{{TAG}}>
    </div>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
