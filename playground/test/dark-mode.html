<!DOCTYPE html>
<html lang="en" data-kmwc="off">
<head>
    <meta charset="UTF-8">
    <title>web-playground dark-mode fixture</title>
</head>
<body>
    <web-playground id="light-default" label="light default"></web-playground>
    <web-playground id="dark-instance" label="dark instance" data-theme="dark"></web-playground>
    <web-playground id="light-instance" label="light instance" data-theme="light"></web-playground>
    <!-- A theme source that is not an ancestor: only core's data-context-theme reaches it. -->
    <div id="dark-panel" data-theme="dark"></div>
    <web-playground id="dark-source" label="dark source" theme-source="#dark-panel"></web-playground>
    <div style="--base-main-bg: rgb(255, 0, 0)">
        <web-playground id="base-themed" label="--base-main-bg"></web-playground>
    </div>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
